# gitleaks config — secret scanning for BizAssist (REVIEW_1 GAP-8).
# Run locally:  gitleaks protect --staged   (or via pre-commit, see .pre-commit-config.yaml)
# CI runs the same scanner as a required workflow job.

[extend]
# Start from gitleaks' built-in rules (AWS, GCP, Slack, generic API keys, JWTs…)
useDefault = true

[[rules]]
id = "groq-api-key"
description = "Groq API key"
regex = '''gsk_[A-Za-z0-9]{20,}'''
keywords = ["gsk_"]

[[rules]]
id = "supabase-postgres-url"
description = "Postgres connection string with credentials"
regex = '''postgres(?:ql)?://[^\s:]+:[^\s@]+@[^\s/]+'''
keywords = ["postgresql://", "postgres://"]

[allowlist]
description = "Explicit synthetic examples only; documentation is scanned too"
regexes = [
    '''postgres(?:ql)?://postgres:(?:pass|isolated-fixture-only)@(?:localhost|127\.0\.0\.1)(?::[0-9]+)?''',
    '''postgres(?:ql)?://[^:\s]+:[^@\s]+@(?:db\.example|127\.0\.0\.1)(?::[0-9]+)?''',
    '''https://user:synthetic-password@db\.example''',
    '''(?:dev-test-secret-please-change|test-only-secret-please-change)-0123456789abcdef''',
    '''ci-secret-0123456789abcdef0123456789abcdef''',
    '''cron-secret-0123456789abcdef''',
    '''rakshithananda18-cmyk_bizassist-billing''',
]

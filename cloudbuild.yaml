steps:
  # 1. Pull latest image from Artifact Registry for layer caching
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull ${_IMAGE_NAME}:latest || exit 0

  # 2. Build image with Docker layer caching enabled
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_IMAGE_NAME}:latest'
      - '-t'
      - '${_IMAGE_NAME}:$SHORT_SHA'
      - '--cache-from'
      - '${_IMAGE_NAME}:latest'
      - 'backend'

  # 3. Push cached layers to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_IMAGE_NAME}:latest'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_IMAGE_NAME}:$SHORT_SHA'

  # 4. Deploy image directly to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'staterbill-api'
      - '--image'
      - '${_IMAGE_NAME}:$SHORT_SHA'
      - '--region'
      - '${_REGION}'
      - '--project'
      - '$PROJECT_ID'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '1'
      - '--cpu'
      - '1'
      - '--memory'
      - '1Gi'
      - '--cpu-boost'
      - '--concurrency'
      - '80'
      - '--timeout'
      - '120'
      - '--quiet'

# Use high-performance 8-vCPU instance for ultra-fast builds
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: 'asia-south1'
  _IMAGE_NAME: 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/staterbill-api'

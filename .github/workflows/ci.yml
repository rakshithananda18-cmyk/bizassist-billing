name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: rls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SQLite Logic Tests (fast — pytest-xdist across all cores)
        # Mirrors `run_tests.ps1 -Fast`: parallel across all CPU cores. conftest
        # keys each worker's SQLite file on the xdist worker id (test_bizassist_gw*.db)
        # so runs stay isolated; --dist loadscope keeps a module's tests on one
        # worker (module-scoped DB fixtures never straddle workers).
        env:
          JWT_SECRET: dev-test-secret-please-change-0123456789abcdef
          GROQ_API_KEY: mock_groq_api_key
        run: |
          cd backend
          python -m pytest -q -n auto --dist loadscope --ignore=tests/test_rls_postgres.py

      - name: Run Postgres RLS Tests
        env:
          TEST_PG_URL: postgresql://postgres:pass@localhost:5432/rls_test
          JWT_SECRET: dev-test-secret-please-change-0123456789abcdef
          GROQ_API_KEY: mock_groq_api_key
        run: |
          cd backend
          python -m pytest tests/test_rls_postgres.py -v

      - name: Run Financial Invariants on Postgres (cross-dialect drift guard)
        # Re-runs the money-layer suites against the SAME Postgres service so a
        # SQLite-only pass can't hide a dialect-specific accounting/sync bug.
        # conftest honours BIZASSIST_TEST_DATABASE_URL to point the whole suite
        # at Postgres (db name contains "test" to satisfy the fail-closed guard).
        env:
          BIZASSIST_TEST_DATABASE_URL: postgresql://postgres:pass@localhost:5432/rls_test
          JWT_SECRET: dev-test-secret-please-change-0123456789abcdef
          GROQ_API_KEY: mock_groq_api_key
        run: |
          cd backend
          python -m pytest -q -p no:randomly \
            tests/test_billing.py \
            tests/test_financial_invariants.py \
            tests/test_negative_stock_policy.py \
            tests/test_journal.py \
            tests/test_hash_chain.py \
            tests/test_trial_balance.py \
            tests/test_period_lock.py \
            tests/test_party_ledger.py \
            tests/test_sync_financial_conflicts.py \
            tests/test_ops_health.py

      - name: Run Sync & Tenant Suites on Postgres (finding-17 class guard)
        # WHY THIS STEP EXISTS (docs/PLATFORM_STATE_AND_PENDING_WORK_2026-08-03.md C-8)
        #
        # SQLite has no real type system: it accepts ANY type name in
        # `ADD COLUMN`, including ones no engine has. So a SQLite-only pass
        # proves very little about the cloud. That is exactly how
        # `ALTER TABLE users ADD COLUMN last_login DATETIME` shipped — Postgres
        # has no DATETIME, the Space crash-looped at import, every device got
        # 503, and ALL sync stopped (SYNC_LIVENESS_AUDIT finding 17).
        #
        # `ensure_tenant_fks` emits DIFFERENT DDL per dialect — composite
        # FOREIGN KEYs on Postgres, BEFORE-triggers on SQLite — and until this
        # step the Postgres half had never executed anywhere, including here.
        # DATA_ARCHITECTURE_OPTIONS exit criterion 2 is "every rule installed on
        # BOTH databases"; this is the only place that can be shown.
        #
        # The Postgres service above is already running, so this costs minutes.
        #
        # If this goes red: fix the drift, or skip the individual test with a
        # written reason. Do NOT add `continue-on-error` — a green tick over a
        # suite that cannot pass is the failure mode CLEANUP_PLAN §6.2 is about.
        env:
          BIZASSIST_TEST_DATABASE_URL: postgresql://postgres:pass@localhost:5432/rls_test
          JWT_SECRET: dev-test-secret-please-change-0123456789abcdef
          GROQ_API_KEY: mock_groq_api_key
        run: |
          cd backend
          python -m pytest -q -p no:randomly \
            tests/test_tenant_fk_invariants.py \
            tests/test_db_invariants.py \
            tests/test_migration_step_isolation.py \
            tests/test_migration_ddl_is_portable.py \
            tests/test_dbcompat_and_sql_portability.py \
            tests/test_sync.py \
            tests/test_sync_pull.py \
            tests/test_sync_inbox.py \
            tests/test_sync_idempotency.py \
            tests/test_sync_liveness_regressions.py \
            tests/test_parity_is_bidirectional.py \
            tests/test_sync_volume_and_tenancy.py \
            tests/test_tenant_scope.py \
            tests/test_uid_sync_keys.py

  # BUG-3 guard: the sync/relay/routing tests are the ones that hide real
  # data-loss bugs. Run them repeatedly, in both fixed and randomized order,
  # to catch order/environment-dependent nondeterminism before it ships.
  flaky-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-randomly

      - name: Repeat-run determinism-critical modules (10x)
        env:
          JWT_SECRET: dev-test-secret-please-change-0123456789abcdef
          GROQ_API_KEY: mock_groq_api_key
          DATABASE_URL: sqlite:///./test_bizassist.db
        run: |
          cd backend
          # T2.5: realtime relay + sync modules included — these are the ones
          # that hide real data-loss bugs when they flake.
          MODULES="tests/test_discovery.py tests/test_routing_tiers.py tests/test_token_accounting.py tests/test_auth_logging.py tests/test_realtime_delta.py tests/test_realtime_sync.py tests/test_sync.py tests/test_sync_idempotency.py tests/test_sync_pull.py"
          echo "== 5x fixed order (pytest-randomly disabled) =="
          for i in $(seq 1 5); do
            echo "--- fixed run $i ---"
            python -m pytest $MODULES -p no:randomly -q || exit 1
          done
          echo "== 5x randomized order (order-independence) =="
          for i in $(seq 1 5); do
            echo "--- random run $i ---"
            python -m pytest $MODULES -q || exit 1
          done
          echo "All 10 runs green — modules are deterministic."

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend-billing/package-lock.json
            frontend-ai/package-lock.json

      - name: Test frontend-billing
        run: |
          cd frontend-billing
          npm ci
          npm test

      - name: Test frontend-ai
        run: |
          cd frontend-ai
          npm ci
          npm test

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Backend Server
        env:
          JWT_SECRET: dev-test-secret-please-change-0123456789abcdef
          GROQ_API_KEY: mock_groq_api_key
          DATABASE_URL: sqlite:///./test_bizassist.db
          ALLOW_TEST_USERS: '1'
        run: |
          cd backend
          python -m uvicorn main_groq:app --host 127.0.0.1 --port 8001 &
          
          # Wait for backend to be ready
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8001/health; then
              echo "Backend is up and running!"
              break
            fi
            echo "Waiting for backend..."
            sleep 1
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-billing/package-lock.json

      - name: Install Playwright and browser
        run: |
          cd frontend-billing
          npm ci
          npx playwright install chromium --with-deps

      - name: Run Playwright E2E tests
        env:
          E2E_BASE_URL: http://localhost:5174
        run: |
          cd frontend-billing
          npm run e2e

name: Field Team

# backend-task/ + frontend-task/ are BizAssist Task (Field Team): its own
# service (HF Space + Vercel project) sharing billing's database and owner
# accounts. This runs on its own changes AND on the billing files it depends
# on — the users / customers models, the hand-off ticket, the Alembic
# autogenerate guard — so a billing change that would break Field Team fails
# here, before deploy.
on:
  push:
    branches: [ main ]
    paths:
      - 'backend-task/**'
      - 'frontend-task/**'
      - 'backend/database/models.py'
      - 'backend/database/db.py'
      - 'backend/services/auth.py'
      - 'backend/alembic/env.py'
      - '.github/workflows/field-team.yml'
  pull_request:
    branches: [ main ]
    paths:   # same list as push
      - 'backend-task/**'
      - 'frontend-task/**'
      - 'backend/database/models.py'
      - 'backend/database/db.py'
      - 'backend/services/auth.py'
      - 'backend/alembic/env.py'
      - '.github/workflows/field-team.yml'

env:
  JWT_SECRET: ci-secret-0123456789abcdef0123456789abcdef

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Disposable CI databases create free fixture owners via /owner/signup.
      # Cloud deployments always enforce Pro; only these fixtures opt out.
      SUBSCRIPTION_ENFORCED: '0'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: task_test
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend-task
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend-task/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests on SQLite (parallel, like run_tests.bat task fast)
        run: python -m pytest -n auto --dist loadscope
      - name: Tests on Postgres (Supabase dialect, RLS migration)
        env:
          TASK_TEST_DATABASE_URL: postgresql://postgres:pass@localhost:5432/task_test
          # The isolation regression creates its own temporary NOBYPASSRLS
          # role/schema, so this covers actual policies as well as GUC values.
          TASK_RLS_ADMIN_TEST_URL: postgresql://postgres:pass@localhost:5432/task_test
        run: python -m pytest

  image:
    name: Cloud Run image builds and serves on $PORT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The exact image Cloud Run builds (deploy_cloudrun.ps1 uses --source
      # backend-task). Building it here catches dependency drift before a
      # deploy does — billing's 2026-10-22 outage was an image nobody had built.
      - name: Build backend-task/Dockerfile
        run: docker build -t bizassist-task backend-task
      - name: Image starts on PORT=8080 with an explicit disposable database fixture
        run: |
          # This proves image startup and routing, not the deployed database
          # topology. The backend/contract jobs above/below cover Postgres.
          # Production refuses SQLite even when the mirror flag is supplied.
          docker run -d --name api -p 8080:8080 \
            -e PORT=8080 -e TASK_PURGE_LOOP=0 -e JWT_SECRET="$JWT_SECRET" \
            -e TASK_CREATE_BILLING_MIRROR=1 \
            -e DATABASE_URL=sqlite:////tmp/ci_test.db bizassist-task
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/api/health; then
              echo; curl -sf http://127.0.0.1:8080/; echo; exit 0
            fi
            sleep 1
          done
          docker logs api; exit 1

  contract:
    name: On billing's real schema and ticket
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: contract_test
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      CONTRACT_DB: postgresql://postgres:pass@localhost:5432/contract_test
      # Exercise full workflows with disposable free owners; entitlement
      # enforcement itself is covered by the plan/config regression tests.
      SUBSCRIPTION_ENFORCED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend-task/requirements-dev.txt
      # Field Team's own requirements are enough to import billing's models
      # and services.auth — no torch / AI stack needed for this job.
      - run: pip install -r backend-task/requirements-dev.txt
      - name: Billing creates its schema with its own models
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.CONTRACT_DB }}
          GROQ_API_KEY: mock_groq_api_key
        run: |
          python -c "from database.db import Base, engine; import database.models, core.models; Base.metadata.create_all(bind=engine); print(len(Base.metadata.tables), 'billing tables')"
      - name: Field Team suite on that schema, plus billing-minted tickets
        working-directory: backend-task
        env:
          TASK_TEST_DATABASE_URL: ${{ env.CONTRACT_DB }}
          TASK_RLS_ADMIN_TEST_URL: ${{ env.CONTRACT_DB }}
          TASK_TEST_BILLING_SCHEMA: external
          BILLING_BACKEND_DIR: ${{ github.workspace }}/backend
          GROQ_API_KEY: mock_groq_api_key
        run: python -m pytest -rs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-task
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-task/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

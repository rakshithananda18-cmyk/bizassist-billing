name: SonarQube Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run Backend Tests with Coverage
        # `-n auto --dist loadscope` is NOT a speed tweak here, it is the only
        # supported way to run this suite — the same flags ci.yml and
        # `run_tests.ps1 -Fast` use, and for the reason ci.yml already states:
        # conftest.py keys the SQLite file on the xdist worker id
        # (test_bizassist_gw0.db, gw1, …), so each worker gets its OWN database
        # and --dist loadscope keeps a whole module on one worker.
        #
        # Run serially, all 2050 tests share a single test_bizassist.db and
        # accumulate each other's state. 28 of them then fail on fixed-identity
        # collisions across modules — `admin` and `own_totp_owner` are signed up,
        # force-logged-out and token-version-bumped by one module and expected
        # intact by the next (test_backend, test_admin_console_sso,
        # test_review1_hardening, test_totp_and_metrics, test_invoice_account).
        # Reproduced locally: 28 failed / 2020 passed serial, 2050 passed with
        # these flags, same commit.
        #
        # That is why this job has been red since it was added while the
        # identical suite was green in ci.yml: the scan never ran at all, it was
        # skipped behind a test step failing on its invocation rather than on
        # the code. pytest-cov combines the per-worker coverage data itself, so
        # the XML the scanner uploads is unaffected.
        run: |
          cd backend
          python -m pytest -q -n auto --dist loadscope --ignore=tests/test_rls_postgres.py --cov=. --cov-report=xml
        env:
          # DATABASE_URL is deliberately NOT set here. tests/conftest.py owns it:
          # it resolves a per-xdist-worker SQLite file (or honours
          # BIZASSIST_TEST_DATABASE_URL for the cross-dialect Postgres run) BEFORE
          # any module imports, and database/db.py fails closed unless the URL
          # names a test DB. Exporting it from the workflow only created a second
          # source of truth that conftest then overwrote.
          JWT_SECRET: "dev-test-secret-please-change-0123456789abcdef"
          GROQ_API_KEY: "mock_groq_api_key"
          ALLOW_TEST_USERS: "1"
          # Keep the B2B cloud proxy pointed at a dead address as a belt to the
          # S-5 test guard: the suite must never reach a real deployment.
          CLOUD_API_URL: "http://127.0.0.1:9"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-billing/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend-billing
        run: |
          npm ci

      - name: Run Frontend Tests with Coverage
        working-directory: frontend-billing
        run: |
          npx vitest run --coverage --coverage.reporter=lcov

      # SonarSource DEPRECATED `sonarcloud-github-action` — its own repo
      # description now reads "Deprecated. Use
      # https://github.com/SonarSource/sonarqube-scan-action instead." Since
      # v4.1.0 `sonarqube-scan-action` is the single entrypoint for both
      # SonarQube Server and Cloud, and it is a drop-in replacement. It does
      # require SONAR_HOST_URL, which the old action inferred.
      #
      # Pinned to a major version rather than @master: a scanner that can change
      # under you between runs makes "the gate went red" unattributable.
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Team Tests</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --border: #e3e6eb; --text: #1b1f24; --muted: #66707c;
    --pass: #1a7f4b; --fail: #c62f2f; --skip: #9a6b00; --accent: #d9452b;
    --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --surface: #1a1e24; --border: #2b313a; --text: #e8ebef; --muted: #98a2ae;
            --pass: #4cc38a; --fail: #ff6b6b; --skip: #e3b341; --accent: #ff7a5c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  h1 span { color: var(--accent); }
  #status { font-weight: 600; color: var(--muted); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 16px 0; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .card b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
  .card small { color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
  .bar { height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; }
  .toolbar { display: flex; gap: 8px; margin: 16px 0 8px; flex-wrap: wrap; }
  .toolbar button { border: 1px solid var(--border); background: var(--surface); color: var(--text);
                    border-radius: 999px; padding: 4px 12px; cursor: pointer; font: inherit; }
  .toolbar button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  details.file { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin: 8px 0; }
  details.file > summary { cursor: pointer; padding: 10px 14px; display: flex; gap: 10px; align-items: center; }
  details.file > summary code { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .counts { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  ul { list-style: none; margin: 0; padding: 0 14px 10px; }
  li { padding: 4px 0; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  li .name { flex: 1; min-width: 0; overflow-wrap: anywhere; font-family: var(--mono); font-size: 12.5px; }
  li .dur { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
  .passed { background: var(--pass); } .failed { background: var(--fail); } .skipped { background: var(--skip); }
  pre { width: 100%; margin: 6px 0 4px; padding: 10px; overflow-x: auto; border-radius: 8px;
        background: var(--bg); border: 1px solid var(--border); font: 12px/1.4 var(--mono); white-space: pre; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>BizAssist <span>Field Team</span> · tests</h1>
    <div id="status">Waiting for results…</div>
  </header>
  <div class="cards">
    <div class="card"><small>Total</small><b id="total">0</b></div>
    <div class="card"><small>Passed</small><b id="passed" style="color:var(--pass)">0</b></div>
    <div class="card"><small>Failed</small><b id="failed" style="color:var(--fail)">0</b></div>
    <div class="card"><small>Skipped</small><b id="skipped" style="color:var(--skip)">0</b></div>
    <div class="card"><small>Duration</small><b id="duration">0.0s</b></div>
  </div>
  <div class="bar" aria-hidden="true"><i id="bar-pass" class="passed"></i><i id="bar-fail" class="failed"></i><i id="bar-skip" class="skipped"></i></div>
  <div class="toolbar" role="tablist">
    <button data-filter="all" class="on">All</button>
    <button data-filter="failed">Failed</button>
    <button data-filter="slow">Slowest</button>
  </div>
  <div id="list"><p class="empty">No tests reported yet.</p></div>
</main>
<script>
  let filter = 'all'
  let last = null
  let timer = null
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

  document.querySelectorAll('[data-filter]').forEach((b) => b.addEventListener('click', () => {
    filter = b.dataset.filter
    document.querySelectorAll('[data-filter]').forEach((x) => x.classList.toggle('on', x === b))
    if (last) render(last)
  }))

  function render(data) {
    const s = data.summary || {}
    const tests = data.tests || []
    const done = s.passed + s.failed + s.skipped
    const total = Math.max(s.total || 0, done)
    for (const k of ['passed', 'failed', 'skipped']) document.getElementById(k).textContent = s[k] || 0
    document.getElementById('total').textContent = total
    document.getElementById('duration').textContent = `${(s.duration || 0).toFixed(1)}s`
    const pct = (n) => (total ? (100 * n) / total : 0) + '%'
    document.getElementById('bar-pass').style.width = pct(s.passed || 0)
    document.getElementById('bar-fail').style.width = pct(s.failed || 0)
    document.getElementById('bar-skip').style.width = pct(s.skipped || 0)
    document.getElementById('status').textContent = s.status === 'completed'
      ? (s.failed ? `Finished · ${s.failed} failed` : 'Finished · all passed')
      : `Running · ${done}${total ? ' / ' + total : ''}`

    let shown = tests
    if (filter === 'failed') shown = tests.filter((t) => t.outcome === 'failed')
    if (filter === 'slow') shown = [...tests].sort((a, b) => b.duration - a.duration).slice(0, 25)
    const list = document.getElementById('list')
    if (!shown.length) { list.innerHTML = `<p class="empty">${filter === 'failed' ? 'Nothing failed.' : 'No tests reported yet.'}</p>`; return }

    const byFile = new Map()
    for (const t of shown) {
      const key = filter === 'slow' ? 'Slowest 25' : (t.file || t.nodeid.split('::')[0])
      if (!byFile.has(key)) byFile.set(key, [])
      byFile.get(key).push(t)
    }
    list.innerHTML = [...byFile].map(([file, ts]) => {
      const failed = ts.filter((t) => t.outcome === 'failed').length
      const open = failed || filter !== 'all' ? ' open' : ''
      const rows = ts.map((t) => `
        <li><span class="dot ${t.outcome}" title="${t.outcome}"></span>
          <span class="name">${esc(t.name)}</span>
          <span class="dur">${(t.duration * 1000).toFixed(0)} ms</span>
          ${t.outcome === 'failed' ? `<pre>${esc(t.longrepr || t.traceback)}</pre>` : ''}</li>`).join('')
      return `<details class="file"${open}><summary><span class="dot ${failed ? 'failed' : 'passed'}"></span>
        <code>${esc(file)}</code><span class="counts">${ts.length - failed}/${ts.length}</span></summary><ul>${rows}</ul></details>`
    }).join('')
  }

  async function poll() {
    try {
      const res = await fetch('/api/results', { cache: 'no-store' })
      last = await res.json()
      render(last)
      if (last.summary && last.summary.status === 'completed') { clearInterval(timer); timer = null }
    } catch { /* runner restarting — try again */ }
  }
  poll()
  timer = setInterval(poll, 1000)
</script>
</body>
</html>
